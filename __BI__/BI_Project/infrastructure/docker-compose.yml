version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: infrastructure/dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=BI_Project.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etl_network

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=wael
      - POSTGRES_PASSWORD=2003
      - POSTGRES_DB=bi_project_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wael"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: salesdb_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl_network

  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/dockerfile
    container_name: salesdb_celery_worker
    command: celery -A BI_Project worker --loglevel=info --pool=solo
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=BI_Project.settings
      - DB_NAME=bi_project_db
      - DB_USER=wael
      - DB_PASSWORD=2003
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - etl_network

  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/dockerfile
    container_name: salesdb_celery_beat
    command: celery -A BI_Project beat --loglevel=info
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=BI_Project.settings
      - DB_NAME=bi_project_db
      - DB_USER=wael
      - DB_PASSWORD=2003
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - etl_network

volumes:
  postgres_data:
  redis_data:

networks:
  etl_network:
    driver: bridge
